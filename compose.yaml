name: subscription-analytics

services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-subscription_analytics}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    command: [redis-server, --appendonly, "yes", --maxmemory, "${REDIS_MAXMEMORY:-256mb}", --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bootstrap:
    build:
      context: .
      dockerfile: docker/bootstrap.Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-subscription_analytics}?sslmode=disable
      USERS_PASSWORD: ${USERS_PASSWORD:?Set USERS_PASSWORD in .env}
      SUBSCRIPTIONS_PASSWORD: ${SUBSCRIPTIONS_PASSWORD:?Set SUBSCRIPTIONS_PASSWORD in .env}
      PAYMENTS_PASSWORD: ${PAYMENTS_PASSWORD:?Set PAYMENTS_PASSWORD in .env}
      ANALYTICS_PASSWORD: ${ANALYTICS_PASSWORD:?Set ANALYTICS_PASSWORD in .env}
      DB_VIEWER_PASSWORD: ${DB_VIEWER_PASSWORD:-}
      SEED: ${SEED:-42}
      USERS_COUNT: ${USERS_COUNT:-auto}
      HISTORY_MONTHS: ${HISTORY_MONTHS:-24}
      DATASET_AS_OF: ${DATASET_AS_OF:-2026-11-01T00:00:00Z}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  users-service:
    build:
      context: .
      dockerfile: docker/users-service.Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://users_reader:${USERS_PASSWORD:?Set USERS_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-subscription_analytics}?sslmode=disable
      MOCK_DELAY: ${MOCK_DELAY:-50ms}
      MOCK_500_BPS: ${MOCK_500_BPS:-100}
      MOCK_429_BPS: ${MOCK_429_BPS:-100}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  subscriptions-service:
    build:
      context: .
      dockerfile: docker/subscriptions-service.Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://subscriptions_reader:${SUBSCRIPTIONS_PASSWORD:?Set SUBSCRIPTIONS_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-subscription_analytics}?sslmode=disable
      MOCK_DELAY: ${MOCK_DELAY:-50ms}
      MOCK_500_BPS: ${MOCK_500_BPS:-100}
      MOCK_429_BPS: ${MOCK_429_BPS:-100}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  payments-service:
    build:
      context: .
      dockerfile: docker/payments-service.Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://payments_reader:${PAYMENTS_PASSWORD:?Set PAYMENTS_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-subscription_analytics}?sslmode=disable
      MOCK_DELAY: ${MOCK_DELAY:-50ms}
      MOCK_500_BPS: ${MOCK_500_BPS:-100}
      MOCK_429_BPS: ${MOCK_429_BPS:-100}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: docker/analytics-service.Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://analytics_app:${ANALYTICS_PASSWORD:?Set ANALYTICS_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-subscription_analytics}?sslmode=disable
      OPS_USERNAME: ${OPS_USERNAME:-ops}
      OPS_PASSWORD: ${OPS_PASSWORD:-}
      METRICS_PORT: "9091"
      REDIS_ADDR: redis:6379
      USERS_URL: http://users-service:8080
      SUBSCRIPTIONS_URL: http://subscriptions-service:8080
      PAYMENTS_URL: http://payments-service:8080
      SYNC_INTERVAL: ${SYNC_INTERVAL:-10m}
      SYNC_TIMEOUT: ${SYNC_TIMEOUT:-2m}
      HTTP_REQUEST_TIMEOUT: ${HTTP_REQUEST_TIMEOUT:-5s}
      RETRY_ATTEMPTS: ${RETRY_ATTEMPTS:-4}
    ports:
      - "${ANALYTICS_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      users-service:
        condition: service_healthy
      subscriptions-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
    networks: [backend, edge, observability]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.1@sha256:59ee9021a8884437c7fd8aae79e0a46ee6b6dd3afd7f24a587c4501585fde53b
    environment:
      URLS: '[{"url":"/openapi.json","name":"Analytics API"},{"url":"/openapi-mocks.json","name":"Internal mock contracts"}]'
      VALIDATOR_URL: none
      QUERY_CONFIG_ENABLED: "false"
      PERSIST_AUTHORIZATION: "false"
      DEEP_LINKING: "true"
    networks: [observability]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.19.0@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    profiles: [observability]
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${OPS_PASSWORD:-disabled-setup-account}
      # One operator is authenticated by the analytics gateway.
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGPASS_FILE: /run/config/pgpass
    configs:
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
      - source: pgadmin-pgpass
        target: /run/config/pgpass
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    networks: [backend]
    healthcheck:
      test: [CMD, /venv/bin/python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/misc/ping', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  demo-traffic:
    profiles: [demo]
    build:
      context: .
      dockerfile: docker/demo-traffic.Dockerfile
    environment:
      TARGET_URL: http://analytics-service:8080
    command: [-duration, 3m, -rps, "10", -concurrency, "4"]
    networks: [backend]
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=${PUBLIC_BASE_URL:-http://localhost:8080}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend, observability]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [observability]
    environment:
      GF_SERVER_ROOT_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_HOME_PAGE: /d/subscope-overview
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Editor
      GF_LIVE_MAX_CONNECTIONS: "0"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [observability]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/grafana/api/health]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge: {}
  observability:
    internal: true

volumes:
  postgres-data:
  redis-data:

  prometheus-data:
  grafana-data:
  pgadmin-data:

configs:
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Аналитика подписок — PostgreSQL",
            "Group": "Демо",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "${POSTGRES_DB:-subscription_analytics}",
            "Username": "demo_viewer",
            "PassFile": "/var/lib/pgadmin/.pgpass",
            "ConnectionParameters": {
              "sslmode": "prefer",
              "connect_timeout": "5",
              "passfile": "/var/lib/pgadmin/.pgpass"
            }
          }
        }
      }
  pgadmin-pgpass:
    content: |
      postgres:5432:*:demo_viewer:${DB_VIEWER_PASSWORD:-}
