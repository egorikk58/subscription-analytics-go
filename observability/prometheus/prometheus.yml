global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: analytics
    static_configs:
      - targets: [analytics-service:9091]
  - job_name: users
    static_configs:
      - targets: [users-service:9091]
  - job_name: subscriptions
    static_configs:
      - targets: [subscriptions-service:9091]
  - job_name: payments
    static_configs:
      - targets: [payments-service:9091]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
